version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: pathfinder-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: pathfinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathfinder-backend
    restart: always
    depends_on:
      - db
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:password123@db:5432/pathfinder
      SECRET_KEY: production_secret_key_change_me_2026
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pathfinder-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:

